name: ci
on:
  push:
    branches: [main, "research/**"]
  pull_request:
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev,dashboard]"
      # Synthetic fixtures only: no downloads, no RPW data, no model training.
      - run: pytest -q
