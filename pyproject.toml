[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rpi"
version = "0.1.0"
description = "R01: service-level quote continuity in World Bank Remittance Prices Worldwide"
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.2",
  "numpy>=1.26",
  "scikit-learn>=1.5",
  "scipy>=1.12",
  "matplotlib>=3.8",
  "openpyxl>=3.1",
  "pyarrow>=15",
  "pyyaml>=6",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
dashboard = ["streamlit>=1.66,<2", "altair>=6.3,<7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
