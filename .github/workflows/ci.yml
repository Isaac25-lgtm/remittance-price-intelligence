name: ci
on:
  push:
    branches: [main, "research/**"]
  pull_request:
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev,dashboard]"
      # Synthetic fixtures/public aggregates only; no downloads or real research fits.
      - run: pytest -q tests research_completion/phase3/code/test_science.py research_completion/phase3/followup_20261021/test_followup.py
      - name: Small Linux numerical fixture
        env:
          OMP_NUM_THREADS: "2"
          OPENBLAS_NUM_THREADS: "2"
          MKL_NUM_THREADS: "2"
          NUMEXPR_NUM_THREADS: "2"
          PYTHONHASHSEED: "0"
        run: |
          python research_completion/phase3/code/reproduction.py ci_fixture_1 --fixture
          python research_completion/phase3/code/reproduction.py ci_fixture_2 --fixture
      - uses: actions/upload-artifact@v4
        with:
          name: phase3-linux-synthetic-numerical-fixture
          path: research_completion/phase3/reproducibility/ci_fixture_*.json
